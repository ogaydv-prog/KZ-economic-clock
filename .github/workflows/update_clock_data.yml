name: Weekly Economic Clock Update

on:
  schedule:
    # 05:00 UTC = 10:00 AM по Астане каждый понедельник
    - cron: '0 5 * * 1'
  workflow_dispatch: # Позволяет запустить обновление вручную из интерфейса GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Script
        run: python update_data.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: data.json [Monday 10:00 ALMT]" && git push)
