name: Update Kazakhstan Economic Clock

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run parser and updater script
        run: |
          python update_stats.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.name"
          git add index.html
          git commit -m "Auto-update macroeconomic indicators [skip ci]" || exit 0
          git push
